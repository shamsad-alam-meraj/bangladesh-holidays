# Release pipeline (runs only on the main branch):
#
# 1. Every push to main runs release-please, which keeps a "release PR" up to date from
#    Conventional Commits (version bump in package.json + src/version.ts, CHANGELOG entry).
# 2. Merging that PR creates the vX.Y.Z tag and GitHub release, and the publish job stages the
#    package on npm via trusted publishing (OIDC, no token) with provenance.
# 3. A maintainer approves the staged version with 2FA (npm stage approve <id>, or on
#    npmjs.com), which makes it public.
#
# Recovery: if staging fails after a tag was created, fix the cause (see RELEASING.md →
# Troubleshooting) and either "Re-run failed jobs" or run this workflow manually on main with
# the tag (e.g. v1.0.2). Re-running is safe: versions already on npm are skipped.
#
# This file name (publish.yml) and the "npm" environment must match the trusted publisher
# configured on npmjs.com.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)stage on npm, e.g. v1.0.2. Leave empty to only run release-please."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Optional: a fine-grained token lets CI run on release PRs (PRs opened with the
          # default GITHUB_TOKEN do not trigger other workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Stage on npm
    needs: release-please
    # !cancelled(): a manual run with a tag still publishes even if release-please failed.
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/bangladesh-holidays
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v1.2.3" && exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure npm supports staged trusted publishing
        run: npm install --global npm@^11.16.0

      - name: Pre-flight checks
        id: preflight
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          SOURCE_VERSION=$(node -p "/VERSION = \"([^\"]+)\"/.exec(require('fs').readFileSync('src/version.ts','utf8'))[1]")
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $VERSION" && exit 1
          fi
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::src/version.ts ($SOURCE_VERSION) does not match package.json ($VERSION)" && exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published on npm — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # Pre-releases (1.2.0-beta.1) must not become "latest".
          if [[ "$VERSION" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - if: steps.preflight.outputs.skip != 'true'
        run: npm ci

      - name: Verify (typecheck, lint, tests, build, package checks, examples, smoke test)
        if: steps.preflight.outputs.skip != 'true'
        run: npm run release:check

      - name: Stage release on npm
        if: steps.preflight.outputs.skip != 'true'
        # Scripts already ran above; --ignore-scripts avoids running release:check twice.
        run: npm stage publish --provenance --ignore-scripts --tag "${{ steps.preflight.outputs.dist_tag }}"

      - name: Summary
        if: steps.preflight.outputs.skip != 'true'
        run: |
          {
            echo "### bangladesh-holidays ${RELEASE_TAG} staged on npm"
            echo
            echo "Approve it with 2FA to make it public:"
            echo
            echo '```sh'
            echo "npm stage list bangladesh-holidays"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain authentication failures
        if: failure()
        run: |
          {
            echo "### Staging failed"
            echo
            echo "If the log shows **E401 / Unable to authenticate**, npm did not match this run to a trusted publisher."
            echo "Check with \`npm trust list bangladesh-holidays\` that an entry has:"
            echo "repository \`shamsad-alam-meraj/bangladesh-holidays\`, file \`publish.yml\`, environment \`npm\`, permission \`stage publish\`."
            echo
            echo "After fixing, use **Re-run failed jobs**, or run this workflow on main with tag \`${RELEASE_TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"

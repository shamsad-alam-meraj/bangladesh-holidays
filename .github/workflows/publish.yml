# Release pipeline (runs only on the main branch):
#
# 1. Every push to main runs release-please, which keeps a "release PR" up to date from
#    Conventional Commits (version bump in package.json + src/version.ts, CHANGELOG entry).
# 2. Merging that PR creates the vX.Y.Z tag and GitHub release, and the publish job stages the
#    package on npm via trusted publishing (OIDC, no token) with provenance.
# 3. A maintainer approves the staged version with 2FA (npm stage approve <id>, or on
#    npmjs.com), which makes it public.
#
# This file name (publish.yml) and the "npm" environment must match the trusted publisher
# configured on npmjs.com.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Optional: a fine-grained token lets CI run on release PRs (PRs opened with the
          # default GITHUB_TOKEN do not trigger other workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Stage on npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/bangladesh-holidays
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Ensure npm supports staged trusted publishing
        run: npm install --global npm@^11.16.0
      - run: npm ci
      - name: Verify (typecheck, lint, tests, build, package checks, examples, smoke test)
        run: npm run release:check
      - name: Stage release on npm
        # Scripts were already run above; --ignore-scripts avoids running release:check twice.
        run: npm stage publish --provenance --ignore-scripts
      - name: Summary
        run: |
          {
            echo "### bangladesh-holidays ${{ needs.release-please.outputs.tag_name }} staged on npm"
            echo
            echo "Approve it with 2FA to publish:"
            echo
            echo '```sh'
            echo "npm stage list bangladesh-holidays"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

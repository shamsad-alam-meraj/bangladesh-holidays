name: Feature request
description: Suggest an improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
